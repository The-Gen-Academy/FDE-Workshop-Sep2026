[tool.uv.workspace]
members = ["agent", "local_apps", "packages/claims_core"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests", "agent/tests", "local_apps/tests", "packages/claims_core/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
