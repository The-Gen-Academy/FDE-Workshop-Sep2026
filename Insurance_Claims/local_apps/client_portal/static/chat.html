<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Claim — Meridian Auto Insurance</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="brand">Meridian Auto Insurance</div>
    <div id="claimChip"></div>
    <div id="errorBanner"></div>
    <div class="messages" id="messages"></div>
    <div id="outcome"></div>
    <div class="composer" id="composer">
      <div class="photo-row" id="photoRow">
        <button type="button" class="photo-add-btn" id="addPhotoBtn" title="Attach photos">+</button>
        <input type="file" id="photoInput" accept="image/jpeg,image/png,image/heic,image/webp" multiple capture="environment" style="display:none" />
      </div>
      <div class="hint" id="photoHint">Attach at least 2 photos of the damage when you're ready to submit evidence.</div>
      <div class="composer-row">
        <textarea id="textInput" placeholder="Type your message… (Shift+Enter for a new line)" rows="1"></textarea>
        <button class="primary" id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
